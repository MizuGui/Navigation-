<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Navigation 🧭</title>

  <!-- Dark everywhere -->
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">

  <!-- iOS Home Screen PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Navigation">

  <!-- Icon for home screen (inline SVG as data URI) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgcng9IjI2IiBmaWxsPSIjMGQwZDBmIi8+PHRleHQgeD0iNjAiIHk9Ijc4IiBmb250LXNpemU9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7wn6eBPC90ZXh0Pjwvc3ZnPg==">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:      #0d0d0f;
      --surface: #18181b;
      --border:  rgba(255,255,255,0.08);
      --text:    #f4f4f5;
      --muted:   #71717a;
      --accent:  #6366f1;
      --green:   #22c55e;
      --red:     #ef4444;
      --orange:  #f97316;
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bot: env(safe-area-inset-bottom, 20px);
    }

    /* Native UI (keyboard, scrollbars, form controls, selection) goes dark */
    :root { color-scheme: dark; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html {
      background: var(--bg);
      /* Paints the overscroll / rubber-band area behind the page */
      background-color: var(--bg);
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Solid dark layer behind the notch + home indicator, above everything's z-index floor */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0;
      height: var(--safe-top); background: var(--bg); z-index: 30; pointer-events: none;
    }
    body::after {
      content: ""; position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--safe-bot); background: var(--bg); z-index: 30; pointer-events: none;
    }

    input, button, select, textarea { color-scheme: dark; font-family: inherit; }
    ::placeholder { color: var(--muted); opacity: 1; }
    a { text-decoration: none; }

    /* Text selection + autofill stay dark */
    ::selection { background: rgba(99,102,241,0.35); color: var(--text); }
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--surface) inset;
      caret-color: var(--text);
    }

    /* Kill Safari's light native search decorations */
    input[type="search"] { -webkit-appearance: none; appearance: none; }
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; display: none; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* ── Layout ── */
    /* Fixed dark backdrop — guarantees darkness even where html/body bg won't paint */
    #backdrop {
      position: fixed; inset: 0; background: var(--bg);
      z-index: -1; pointer-events: none;
    }
    #app {
      position: relative;
      background: var(--bg);
      min-height: 100vh; min-height: 100dvh;
      padding-bottom: calc(60px + var(--safe-bot));
    }
    #content { background: var(--bg); }

    /* ── Header ── */
    #header {
      position: sticky; top: 0; z-index: 20;
      background-color: var(--bg);
      background: rgba(13,13,15,0.96);
      backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 12px) 16px 14px;
    }
    #header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: baseline; gap: 8px; }
    #header p  { font-size: 13px; color: var(--muted); margin: 2px 0 14px; }

    /* ── Search ── */
    .search-row { display: flex; gap: 8px; }
    .search-box {
      flex: 1; display: flex; align-items: center; gap: 10;
      background: var(--surface); border-radius: 13px; padding: 0 14px;
      border: 1px solid var(--border);
    }
    .search-box svg { flex-shrink: 0; }
    .search-box input {
      flex: 1; border: none; outline: none; font-size: 15px;
      color: var(--text); background: transparent; padding: 12px 0;
      min-width: 0;
    }
    .search-box input + button {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 17px; padding: 0; line-height: 1;
    }
    #go-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 13px; padding: 0 22px; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit;
      letter-spacing: 0.2px; transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    #go-btn:active { transform: scale(0.95); opacity: 0.85; }
    #go-btn.loading { opacity: 0.65; cursor: default; }

    /* ── Main content ── */
    #content { padding: 16px 16px 0; }

    /* ── Section header ── */
    .section-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .section-head span.label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .section-head span.hint {
      font-size: 11px; color: var(--muted); margin-left: auto;
    }

    /* ── Badge ── */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface); border-radius: 14px;
      border: 1px solid var(--border); padding: 14px 16px;
      margin-bottom: 10px; transition: border-color .2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.15); }

    /* ── Nav buttons (2x2 grid) ── */
    .nav-btns {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-top: 12px;
    }
    .nav-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 12px 8px; border-radius: 12px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2px;
      transition: opacity .15s, transform .1s; border: 1px solid transparent;
    }
    .nav-btn:active { opacity: 0.7; transform: scale(0.95); }
    .nav-btn .icon { font-size: 17px; }

    /* ── Recent searches ── */
    .recent-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-size: 12px; padding: 6px 12px;
      border-radius: 20px; cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s; display: flex; align-items: center; gap: 6px;
    }
    .chip:active { background: rgba(99,102,241,0.15); color: var(--accent); }
    .chip .x { opacity: 0.5; font-size: 13px; }

    /* ── Sort buttons ── */
    .sort-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px; width: 28px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; padding: 0;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .sort-btn svg { display: block; stroke: #a1a1aa; fill: none; }
    .sort-btn:active { background: rgba(99,102,241,0.3); border-color: rgba(99,102,241,0.5); transform: scale(0.92); }
    .sort-btn:active svg { stroke: #818cf8; }
    .sort-btn:disabled { opacity: 0.25; cursor: default; }
    .sort-btn:disabled svg { stroke: #52525b; }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 8px; margin-top: 12px; }
    .tool-btn {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-size: 12px; font-weight: 600;
      padding: 10px 8px; border-radius: 11px; cursor: pointer;
      font-family: inherit; display: flex; align-items: center;
      justify-content: center; gap: 6px; transition: background .15s, color .15s;
    }
    .tool-btn:active { background: rgba(99,102,241,0.15); color: var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: calc(70px + var(--safe-bot)); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(35,35,42,0.96); backdrop-filter: blur(12px);
      color: var(--text); font-size: 13px; font-weight: 600;
      padding: 11px 20px; border-radius: 24px; z-index: 100;
      border: 1px solid var(--border); opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Error ── */
    .error-card {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; font-size: 13px;
      display: flex; gap: 8px; align-items: flex-start;
    }

    /* ── Result card ── */
    .result-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .result-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .result-sub  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .result-gps  { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: monospace; }

    /* ── Save row ── */
    .save-row { display: flex; gap: 8px; margin-top: 12px; }
    .save-row input {
      flex: 1; padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(99,102,241,0.4); font-size: 14px;
      outline: none; background: #1e1e24; color: var(--text);
    }

    /* ── Fav card ── */
    .fav-row { display: flex; align-items: center; gap: 8px; }
    .fav-info { flex: 1; cursor: pointer; padding: 2px 0; border-radius: 10px; transition: background .15s; }
    .fav-info:active { background: rgba(255,255,255,0.04); }
    .fav-name { font-weight: 600; font-size: 14px; }
    .fav-gps  { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace; }
    .drag-handle {
      display: flex; flex-direction: column; gap: 3px;
      padding: 4px 4px; cursor: grab; flex-shrink: 0;
    }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle div { width: 16px; height: 2px; border-radius: 2px; background: rgba(113,113,122,0.6); }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 16px; padding: 4px 3px; line-height: 1;
    }
    .edit-row { display: flex; gap: 8px; }
    .edit-row input {
      flex: 1; padding: 7px 12px; border-radius: 10px;
      border: 1.5px solid rgba(99,102,241,0.4); font-size: 14px;
      outline: none; background: #1e1e24; color: var(--text);
    }

    /* ── Drag states ── */
    .card.dragging  { opacity: 0.35; transform: scale(0.97); }
    .card.drag-over { border-color: rgba(99,102,241,0.6) !important; background: rgba(99,102,241,0.07) !important; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* ── Footer ── */
    #footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(13,13,15,0.96);
      backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + var(--safe-bot));
      text-align: center; font-size: 11.5px; color: var(--muted);
    }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeUp 0.22s ease forwards; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
  </style>
</head>
<body>
<div id="backdrop"></div>
<div id="app">
  <div id="header">
    <h1>Navigation <span>🧭</span></h1>
    <p>Ouvre dans ton app préférée</p>
    <div class="search-row">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2.5" style="margin-right:10px">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="search-input" type="search" placeholder="IKEA Dijon, 47.33 5.07…" autocomplete="off" autocorrect="off">
        <button id="clear-btn" style="display:none" onclick="clearSearch()">✕</button>
      </div>
      <button id="go-btn" onclick="doSearch()">Go</button>
    </div>
    <div class="toolbar">
      <button class="tool-btn" onclick="useMyLocation()" id="loc-btn">📍 Ma position</button>
      <button class="tool-btn" onclick="exportFavs()">💾 Exporter</button>
      <button class="tool-btn" onclick="document.getElementById('import-file').click()">📥 Importer</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importFavs(event)">
    </div>
  </div>

  <div id="content">
    <div id="recent-zone"></div>
    <div id="error-zone"></div>
    <div id="results-zone"></div>
    <div id="divider" class="divider" style="display:none"></div>
    <div id="favs-zone"></div>
  </div>

  <div id="footer">
    📱 Utilise <strong style="color:#6366f1">Safari</strong> sur iPhone pour ouvrir les apps
  </div>
  <div id="toast"></div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const GPS_RE = /^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/;

const CHEV_UP   = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>';
const CHEV_DOWN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

const DEFAULT_FAVS = [
  { id:"fav1", name:"48 rue de Dijon",          lat:47.336343, lon:5.024672 },
  { id:"fav2", name:"15 rue Ernest Champeaux",  lat:47.302580, lon:5.061643 },
  { id:"fav3", name:"32 rue des Granges",       lat:46.185415, lon:5.570450 },
  { id:"fav4", name:"Parking UFR STAPS",        lat:47.311300, lon:5.076300 },
  { id:"fav5", name:"Centre entraînement DFCO", lat:47.339419, lon:5.111857 },
];

// ── State ────────────────────────────────────────────────────────────────────
let favorites = [];
let openFavId = null;

function loadFavs() {
  try { const s = localStorage.getItem("nav_favs"); if (s) return JSON.parse(s); } catch {}
  return DEFAULT_FAVS.map(f => ({...f}));
}
function saveFavs() {
  try { localStorage.setItem("nav_favs", JSON.stringify(favorites)); } catch {}
}

// ── Geocode via Nominatim (OpenStreetMap) ────────────────────────────────────
async function geocode(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=fr&addressdetails=1`;
  const res = await fetch(url, {
    headers: { "Accept-Language": "fr", "User-Agent": "NavigationApp/1.0" },
    signal: AbortSignal.timeout(8000)
  });
  if (!res.ok) throw new Error(`Erreur réseau ${res.status}`);
  const data = await res.json();
  return data.map(p => ({
    display_name: p.display_name,
    lat: p.lat,
    lon: p.lon
  }));
}

// ── Nav buttons HTML ─────────────────────────────────────────────────────────
function navButtonsHTML(name, lat, lon) {
  const enc = encodeURIComponent(name);
  const btns = [
    { label:"Amap",        icon:"🌍", color:"#f97316", url:`iosamap://navi?sourceApplication=app&poiname=${enc}&lat=${lat}&lon=${lon}&dev=1&style=0` },
    { label:"Waze",        icon:"🚗", color:"#38bdf8", url:`waze://?ll=${lat},${lon}&navigate=yes` },
    { label:"Google Maps", icon:"📍", color:"#22c55e", url:`comgooglemaps://?daddr=${lat},${lon}&directionsmode=driving` },
    { label:"Apple Plans", icon:"🍎", color:"#6366f1", url:`maps://?daddr=${lat},${lon}&dirflg=d` },
  ];
  return `<div class="nav-btns">${btns.map(b=>`
    <a class="nav-btn" href="${b.url}"
       style="background:${b.color}1a;border-color:${b.color}33;color:${b.color}">
      <span class="icon">${b.icon}</span><span>${b.label}</span>
    </a>`).join("")}</div>`;
}

// ── Search ───────────────────────────────────────────────────────────────────
const input = document.getElementById("search-input");
const goBtn = document.getElementById("go-btn");
const clearBtn = document.getElementById("clear-btn");

input.addEventListener("input", () => { clearBtn.style.display = input.value ? "" : "none"; });
input.addEventListener("keydown", e => { if (e.key==="Enter") doSearch(); });

function clearSearch() {
  input.value = "";
  clearBtn.style.display = "none";
  document.getElementById("results-zone").innerHTML = "";
  document.getElementById("error-zone").innerHTML = "";
  document.getElementById("divider").style.display = "none";
}

async function doSearch() {
  const q = input.value.trim();
  if (!q) return;
  document.getElementById("error-zone").innerHTML = "";
  document.getElementById("results-zone").innerHTML = "";

  // GPS direct
  const gps = q.match(GPS_RE);
  if (gps) {
    renderResults([{ display_name:`GPS : ${q}`, lat:gps[1], lon:gps[2] }]);
    return;
  }

  goBtn.innerHTML = '<span class="spin">⟳</span>';
  goBtn.classList.add("loading");
  try {
    const places = await geocode(q);
    if (!places.length) showError(`Aucun résultat pour « ${q} »`);
    else { renderResults(places); addRecent(q); }
  } catch(e) {
    showError(e.message);
  } finally {
    goBtn.innerHTML = "Go";
    goBtn.classList.remove("loading");
  }
}

function showError(msg) {
  document.getElementById("error-zone").innerHTML =
    `<div class="card error-card fade-in"><span>⚠️</span><span style="word-break:break-word">${msg}</span></div>`;
}

// ── Results ──────────────────────────────────────────────────────────────────
function renderResults(places) {
  const zone = document.getElementById("results-zone");
  const badge = `<span class="badge" style="background:rgba(99,102,241,.13);border:1px solid rgba(99,102,241,.25);color:#6366f1">${places.length}</span>`;
  let html = `<div class="section-head fade-in"><span class="label">Résultats</span>${badge}</div>`;
  places.forEach((p, i) => {
    const lat = parseFloat(p.lat), lon = parseFloat(p.lon);
    const parts = (p.display_name||"Lieu").split(",");
    const name = parts[0].trim();
    const sub  = parts.slice(1,3).join(",").trim();
    html += `<div class="card fade-in" style="animation-delay:${i*0.05}s" id="res-${i}">
      <div class="result-row">
        <div style="flex:1;min-width:0">
          <div class="result-name">${name}</div>
          ${sub ? `<div class="result-sub">${sub}</div>` : ""}
          <div class="result-gps" onclick="copyGPS(${lat},${lon})" style="cursor:pointer" title="Copier">${lat.toFixed(5)}, ${lon.toFixed(5)} 📋</div>
        </div>
        <button onclick="toggleSave(${i},'${escJ(name)}',${lat},${lon})"
          id="save-btn-${i}"
          style="background:rgba(99,102,241,.15);color:#6366f1;border:1px solid rgba(99,102,241,.3);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0">
          ★ Sauver
        </button>
      </div>
      <div id="save-row-${i}" style="display:none" class="save-row">
        <input id="save-name-${i}" value="${escJ(name)}" placeholder="Nom du favori…">
        <button onclick="confirmSave(${i},${lat},${lon})"
          style="background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer">✓</button>
      </div>
      ${navButtonsHTML(name, lat, lon)}
    </div>`;
  });
  zone.innerHTML = html;
  document.getElementById("divider").style.display = "";
}

let savingIdx = null;
function toggleSave(i, name, lat, lon) {
  const row = document.getElementById(`save-row-${i}`);
  const btn = document.getElementById(`save-btn-${i}`);
  const open = row.style.display === "none";
  row.style.display = open ? "" : "none";
  btn.textContent = open ? "✕ Annuler" : "★ Sauver";
  btn.style.background = open ? "rgba(239,68,68,.15)" : "rgba(99,102,241,.15)";
  btn.style.color = open ? "#ef4444" : "#6366f1";
  btn.style.borderColor = open ? "rgba(239,68,68,.3)" : "rgba(99,102,241,.3)";
  if (open) { const inp = document.getElementById(`save-name-${i}`); inp.value = name; inp.focus(); }
}

function confirmSave(i, lat, lon) {
  const name = document.getElementById(`save-name-${i}`).value.trim() || "Favori";
  favorites.push({ id:`f${Date.now()}`, name, lat, lon });
  saveFavs();
  renderFavs();
  // Reset save UI
  document.getElementById(`save-row-${i}`).style.display = "none";
  const btn = document.getElementById(`save-btn-${i}`);
  btn.textContent = "✓ Sauvé !";
  btn.style.background = "rgba(34,197,94,.15)";
  btn.style.color = "#22c55e";
  btn.style.borderColor = "rgba(34,197,94,.3)";
}

// ── Escape helper ─────────────────────────────────────────────────────────────
function escJ(s) { return (s||"").replace(/'/g,"\\'").replace(/"/g,"&quot;"); }
function escH(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── Favorites ────────────────────────────────────────────────────────────────
function renderFavs() {
  const zone = document.getElementById("favs-zone");
  const badge = `<span class="badge" style="background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.25);color:#f59e0b">${favorites.length}</span>`;
  let html = `<div class="section-head"><span class="label">Favoris</span>${badge}<span class="hint">Trier avec les flèches</span></div>`;

  favorites.forEach((fav, idx) => {
    html += `<div class="card" id="fc-${fav.id}">
      <div class="fav-row" id="frow-${fav.id}">
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
          <button class="sort-btn" onclick="moveFav(${idx},-1)" ${idx===0?'disabled':''} aria-label="Monter">${CHEV_UP}</button>
          <button class="sort-btn" onclick="moveFav(${idx},1)" ${idx===favorites.length-1?'disabled':''} aria-label="Descendre">${CHEV_DOWN}</button>
        </div>
        <div class="fav-info" onclick="toggleFav('${fav.id}')">
          <div class="fav-name">${escH(fav.name)}</div>
          <div class="fav-gps">${fav.lat.toFixed(5)}, ${fav.lon.toFixed(5)}</div>
        </div>
        <button class="icon-btn" onclick="startEdit('${fav.id}')" title="Renommer">✏️</button>
        <button class="icon-btn" onclick="deleteFav('${fav.id}')" title="Supprimer">🗑️</button>
      </div>
      <div id="edit-${fav.id}" style="display:none" class="edit-row">
        <input id="einput-${fav.id}" value="${escH(fav.name)}"
          onkeydown="if(event.key==='Enter')confirmEdit('${fav.id}')">
        <button onclick="confirmEdit('${fav.id}')"
          style="background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer">✓</button>
        <button onclick="cancelEdit('${fav.id}')"
          style="background:rgba(255,255,255,.06);color:var(--muted);border:none;border-radius:8px;padding:7px 10px;cursor:pointer">✕</button>
      </div>
      <div id="fnav-${fav.id}" style="display:none">
        ${navButtonsHTML(fav.name, fav.lat, fav.lon)}
      </div>
    </div>`;
  });
  zone.innerHTML = html;
}

function toggleFav(id) {
  const el = document.getElementById(`fnav-${id}`);
  if (!el) return;
  const isOpen = el.style.display !== "none";
  // Close previously open
  if (openFavId && openFavId !== id) {
    const prev = document.getElementById(`fnav-${openFavId}`);
    if (prev) prev.style.display = "none";
  }
  el.style.display = isOpen ? "none" : "";
  openFavId = isOpen ? null : id;
}

function deleteFav(id) {
  favorites = favorites.filter(f => f.id !== id);
  saveFavs(); renderFavs();
}

function startEdit(id) {
  document.getElementById(`frow-${id}`).style.display = "none";
  document.getElementById(`fnav-${id}`).style.display = "none";
  document.getElementById(`edit-${id}`).style.display = "";
  setTimeout(() => document.getElementById(`einput-${id}`).focus(), 50);
}
function cancelEdit(id) {
  document.getElementById(`frow-${id}`).style.display = "";
  document.getElementById(`edit-${id}`).style.display = "none";
}
function confirmEdit(id) {
  const val = document.getElementById(`einput-${id}`).value.trim();
  if (val) favorites = favorites.map(f => f.id===id ? {...f, name:val} : f);
  saveFavs(); renderFavs();
}

// ── Sort favorites ───────────────────────────────────────────────────────────
function moveFav(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= favorites.length) return;
  const updated = [...favorites];
  const [moved] = updated.splice(idx, 1);
  updated.splice(newIdx, 0, moved);
  favorites = updated;
  saveFavs(); renderFavs();
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

// ── Recent searches ──────────────────────────────────────────────────────────
function loadRecents() {
  try { const s = localStorage.getItem("nav_recents"); if (s) return JSON.parse(s); } catch {}
  return [];
}
function saveRecents(r) {
  try { localStorage.setItem("nav_recents", JSON.stringify(r)); } catch {}
}
function addRecent(q) {
  let r = loadRecents().filter(x => x.toLowerCase() !== q.toLowerCase());
  r.unshift(q);
  r = r.slice(0, 6);
  saveRecents(r);
  renderRecents();
}
function removeRecent(q) {
  saveRecents(loadRecents().filter(x => x !== q));
  renderRecents();
}
function renderRecents() {
  const r = loadRecents();
  const zone = document.getElementById("recent-zone");
  if (!r.length) { zone.innerHTML = ""; return; }
  zone.innerHTML = `<div class="recent-chips">${r.map(q => `
    <button class="chip" onclick="rerun('${escJ(q)}')">
      <span>🕐 ${escH(q)}</span>
      <span class="x" onclick="event.stopPropagation();removeRecent('${escJ(q)}')">✕</span>
    </button>`).join("")}</div>`;
}
function rerun(q) {
  input.value = q;
  clearBtn.style.display = "";
  doSearch();
}

// ── My location ──────────────────────────────────────────────────────────────
function useMyLocation() {
  const btn = document.getElementById("loc-btn");
  if (!navigator.geolocation) { toast("Géolocalisation non disponible"); return; }
  btn.innerHTML = '<span class="spin">⟳</span> Localisation…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      btn.innerHTML = "📍 Ma position";
      renderResults([{ display_name: "Ma position actuelle", lat: String(lat), lon: String(lon) }]);
      toast("Position trouvée ✓");
    },
    err => {
      btn.innerHTML = "📍 Ma position";
      toast(err.code === 1 ? "Accès refusé — autorise la localisation" : "Position introuvable");
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

// ── Export / Import favorites ────────────────────────────────────────────────
function exportFavs() {
  const data = JSON.stringify(favorites, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `favoris-navigation-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`${favorites.length} favoris exportés ✓`);
}

function importFavs(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error("Format invalide");
      const valid = imported.filter(f => f.name && typeof f.lat === "number" && typeof f.lon === "number");
      if (!valid.length) throw new Error("Aucun favori valide");
      // Merge: keep existing, add new ones (dedupe by name+coords)
      const existing = new Set(favorites.map(f => `${f.name}|${f.lat}|${f.lon}`));
      const toAdd = valid
        .filter(f => !existing.has(`${f.name}|${f.lat}|${f.lon}`))
        .map(f => ({ id: `f${Date.now()}${Math.random().toString(36).slice(2,6)}`, name: f.name, lat: f.lat, lon: f.lon }));
      favorites = [...favorites, ...toAdd];
      saveFavs(); renderFavs();
      toast(toAdd.length ? `${toAdd.length} favoris importés ✓` : "Aucun nouveau favori");
    } catch (err) {
      toast("Erreur : " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// ── Copy coordinates ─────────────────────────────────────────────────────────
function copyGPS(lat, lon) {
  const txt = `${lat}, ${lon}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => toast("Coordonnées copiées ✓"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    toast("Coordonnées copiées ✓");
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
favorites = loadFavs();
renderFavs();
renderRecents();
</script>
</body>
</html>
